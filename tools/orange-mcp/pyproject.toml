[project]
name = "orange-mcp"
version = "0.1.0"
description = "OrangeEditor 实时协同 MCP server —— 让 AI 实时操作正在运行的编辑器（ADR-020）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
]

[project.scripts]
orange-mcp = "server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# 单文件 server.py（非包形态），显式声明给 hatchling。
include = ["server.py"]
